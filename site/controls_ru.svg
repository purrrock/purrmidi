<text class="l" x="612" y="354">Громкость</text>
<text class="d" x="612" y="374">Общая громкость, везде</text>
<rect x="30" y="422" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="52" cy="446" r="10" fill="#5a74d6"/>
<text class="num" x="52" y="450.5">4</text>
<rect x="240" y="436" width="48" height="20" rx="10" fill="#5a74d6"/>
<text class="cc" x="264" y="450.3">CC74</text>
<text class="l" x="44" y="480">Яркость / срез</text>
<text class="d" x="44" y="500">Яркость тембра; у Lead — срез</text>
<text class="d" x="44" y="516">фильтра</text>
<rect x="314" y="422" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="336" cy="446" r="10" fill="#2f9b80"/>
<text class="num" x="336" y="450.5">5</text>
<rect x="524" y="436" width="48" height="20" rx="10" fill="#2f9b80"/>
<text class="cc" x="548" y="450.3">CC71</text>
<text class="l" x="328" y="480">Резонанс</text>
<text class="d" x="328" y="500">Яркость или резонанс (по</text>
<text class="d" x="328" y="516">инструменту)</text>
<rect x="598" y="422" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="620" cy="446" r="10" fill="#c97a12"/>
<text class="num" x="620" y="450.5">6</text>
<rect x="808" y="436" width="48" height="20" rx="10" fill="#c97a12"/>
<text class="cc" x="832" y="450.3">CC72</text>
<text class="l" x="612" y="480">Отпускание</text>
<text class="d" x="612" y="500">Как долго звук затухает после</text>
<text class="d" x="612" y="516">клавиши</text>
<rect x="30" y="548" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="52" cy="572" r="10" fill="#1a8fb0"/>
<text class="num" x="52" y="576.5">7</text>
<rect x="240" y="562" width="48" height="20" rx="10" fill="#1a8fb0"/>
<text class="cc" x="264" y="576.3">CC91</text>
<text class="l" x="44" y="606">Реверберация</text>
<text class="d" x="44" y="626">Гулкость помещения; после</text>
<text class="d" x="44" y="642">включения всегда «немного»</text>
<rect x="314" y="548" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="336" cy="572" r="10" fill="#8a6cd6"/>
<text class="num" x="336" y="576.5">8</text>
<rect x="448" y="562" width="124" height="20" rx="10" fill="#8a6cd6"/>
<text class="cc" x="510" y="576.3">Program Change</text>
<text class="l" x="328" y="606">Кнопка смены звука</text>
<text class="d" x="328" y="626">Выбор инструмента (127 =</text>
<text class="d" x="328" y="642">следующий)</text>
<rect x="598" y="548" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="620" cy="572" r="10" fill="#2f9b80"/>
<text class="num" x="620" y="576.5">9</text>
<rect x="808" y="562" width="48" height="20" rx="10" fill="#2f9b80"/>
<text class="cc" x="832" y="576.3">CC64</text>
<text class="l" x="612" y="606">Педаль сустейна</text>
<text class="d" x="612" y="626">Звук тянется, пока педаль</text>
<text class="d" x="612" y="642">нажата (у органа нет)</text>
<text class="n" x="30" y="676">Не нашли свою ручку? Она может отправлять другой CC: полный список в docs/ENGINES.md</text>
