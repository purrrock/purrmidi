<text class="h" x="30" y="42">Что делают ручки и колёса клавиатуры в PurrMidi</text>
<text class="s" x="30" y="64">Названия на вашей клавиатуре могут отличаться; важен номер CC. Что из этого есть именно у вас, зависит от модели.</text>
