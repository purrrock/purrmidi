<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-labelledby="t d">
<title id="t">Что делают ручки и колёса вашей MIDI-клавиатуры</title>
<desc id="d">Схема типовой MIDI-клавиатуры: колесо высоты тона, мод-колесо, ручки громкости и яркости, кнопка смены инструмента и педаль сустейна, с пояснением, что каждый элемент делает в PurrMidi.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#2a2a38}.h{font-size:22px;font-weight:700}.s{font-size:13px;fill:#5d5d70}.l{font-size:15px;font-weight:700}.d{font-size:13px;fill:#5d5d70}.cc{font-size:12.5px;font-weight:700;fill:#fff;text-anchor:middle}.num{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}.n{font-size:12.5px;fill:#5d5d70}</style>
