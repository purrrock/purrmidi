<text class="cc" x="241" y="324.3">Pitch Bend</text>
<text class="l" x="44" y="354">Колесо высоты тона</text>
<text class="d" x="44" y="374">Pitch Bend: ±2 полутона, везде</text>
<rect x="314" y="296" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="336" cy="320" r="10" fill="#5a74d6"/>
