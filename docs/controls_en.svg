<text class="l" x="680" y="354">Brightness / cutoff</text>
<text class="d" x="680" y="374">Tone brightness; filter</text>
<text class="d" x="680" y="390">cutoff on Lead</text>
<rect x="30" y="434" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="52" cy="458" r="10" fill="#2f9b80"/>
<text class="num" x="52" y="462.5">5</text>
<rect x="168" y="448" width="48" height="20" rx="10" fill="#2f9b80"/>
<text class="cc" x="192" y="462.3">CC71</text>
<text class="l" x="44" y="492">Resonance</text>
<text class="d" x="44" y="512">Brightness or resonance</text>
<text class="d" x="44" y="528">(per instrument)</text>
<rect x="242" y="434" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="264" cy="458" r="10" fill="#c97a12"/>
<text class="num" x="264" y="462.5">6</text>
<rect x="380" y="448" width="48" height="20" rx="10" fill="#c97a12"/>
<text class="cc" x="404" y="462.3">CC72</text>
<text class="l" x="256" y="492">Release</text>
<text class="d" x="256" y="512">How long the sound fades</text>
<text class="d" x="256" y="528">after the key</text>
<rect x="454" y="434" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="476" cy="458" r="10" fill="#8a6cd6"/>
<text class="num" x="476" y="462.5">7</text>
<rect x="516" y="448" width="124" height="20" rx="10" fill="#8a6cd6"/>
<text class="cc" x="578" y="462.3">Program Change</text>
<text class="l" x="468" y="492">Instrument button</text>
<text class="d" x="468" y="512">Pick an instrument (127</text>
<text class="d" x="468" y="528">= next)</text>
<rect x="666" y="434" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="688" cy="458" r="10" fill="#2f9b80"/>
<text class="num" x="688" y="462.5">8</text>
<rect x="804" y="448" width="48" height="20" rx="10" fill="#2f9b80"/>
<text class="cc" x="828" y="462.3">CC64</text>
<text class="l" x="680" y="492">Sustain pedal</text>
<text class="d" x="680" y="512">Sound rings while</text>
<text class="d" x="680" y="528">pressed (no sustain on</text>
<text class="d" x="680" y="544">Organ)</text>
<text class="n" x="30" y="576">Can't find your knob? It may send another CC: full list in docs/ENGINES.md (Russian)</text>
