<rect x="122" y="310" width="94" height="20" rx="10" fill="#e0668f"/>
<text class="cc" x="169" y="324.3">Pitch Bend</text>
<text class="l" x="44" y="354">Pitch wheel</text>
<text class="d" x="44" y="374">Pitch Bend: ±2</text>
<text class="d" x="44" y="390">semitones, everywhere</text>
<rect x="242" y="296" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="264" cy="320" r="10" fill="#5a74d6"/>
<text class="num" x="264" y="324.5">2</text>
<rect x="387" y="310" width="41" height="20" rx="10" fill="#5a74d6"/>
<text class="cc" x="408" y="324.3">CC1</text>
<text class="l" x="256" y="354">Mod wheel</text>
<text class="d" x="256" y="374">“Livelier, brighter”; at</text>
<text class="d" x="256" y="390">zero the sound is</text>
<text class="d" x="256" y="406">unchanged</text>
<rect x="454" y="296" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="476" cy="320" r="10" fill="#e0668f"/>
