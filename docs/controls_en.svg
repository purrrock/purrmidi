<title id="t">What the knobs and wheels of your MIDI keyboard do</title>
<desc id="d">Diagram of a typical MIDI keyboard: pitch wheel, mod wheel, volume and brightness knobs, an instrument-change button and a sustain pedal, with a note on what each one does in PurrMidi.</desc>
