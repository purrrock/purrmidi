<rect x="194" y="310" width="94" height="20" rx="10" fill="#e0668f"/>
<text class="cc" x="241" y="324.3">Pitch Bend</text>
<text class="l" x="44" y="354">Pitch wheel</text>
<text class="d" x="44" y="374">Pitch Bend: ±2 semitones,</text>
<text class="d" x="44" y="390">everywhere</text>
<rect x="314" y="296" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="336" cy="320" r="10" fill="#5a74d6"/>
<text class="num" x="336" y="324.5">2</text>
<rect x="531" y="310" width="41" height="20" rx="10" fill="#5a74d6"/>
<text class="cc" x="552" y="324.3">CC1</text>
<text class="l" x="328" y="354">Mod wheel</text>
<text class="d" x="328" y="374">“Livelier, brighter”; at zero</text>
<text class="d" x="328" y="390">the sound is unchanged</text>
<rect x="598" y="296" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="620" cy="320" r="10" fill="#e0668f"/>
<text class="num" x="620" y="324.5">3</text>
<rect x="815" y="310" width="41" height="20" rx="10" fill="#e0668f"/>
<text class="cc" x="836" y="324.3">CC7</text>
<text class="l" x="612" y="354">Volume</text>
<text class="d" x="612" y="374">Master volume, everywhere</text>
<rect x="30" y="422" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="52" cy="446" r="10" fill="#5a74d6"/>
<text class="num" x="52" y="450.5">4</text>
<rect x="240" y="436" width="48" height="20" rx="10" fill="#5a74d6"/>
<text class="cc" x="264" y="450.3">CC74</text>
<text class="l" x="44" y="480">Brightness / cutoff</text>
<text class="d" x="44" y="500">Tone brightness; filter cutoff</text>
<text class="d" x="44" y="516">on Lead</text>
<rect x="314" y="422" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="336" cy="446" r="10" fill="#2f9b80"/>
<text class="num" x="336" y="450.5">5</text>
<rect x="524" y="436" width="48" height="20" rx="10" fill="#2f9b80"/>
<text class="cc" x="548" y="450.3">CC71</text>
<text class="l" x="328" y="480">Resonance</text>
<text class="d" x="328" y="500">Brightness or resonance (per</text>
<text class="d" x="328" y="516">instrument)</text>
<rect x="598" y="422" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="620" cy="446" r="10" fill="#c97a12"/>
<text class="num" x="620" y="450.5">6</text>
<rect x="808" y="436" width="48" height="20" rx="10" fill="#c97a12"/>
<text class="cc" x="832" y="450.3">CC72</text>
<text class="l" x="612" y="480">Release</text>
<text class="d" x="612" y="500">How long the sound fades after</text>
<text class="d" x="612" y="516">the key</text>
<rect x="30" y="548" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="52" cy="572" r="10" fill="#1a8fb0"/>
<text class="num" x="52" y="576.5">7</text>
<rect x="240" y="562" width="48" height="20" rx="10" fill="#1a8fb0"/>
<text class="cc" x="264" y="576.3">CC91</text>
<text class="l" x="44" y="606">Reverb</text>
<text class="d" x="44" y="626">Room ambience; always “a</text>
<text class="d" x="44" y="642">little” after power-on</text>
<rect x="314" y="548" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="336" cy="572" r="10" fill="#8a6cd6"/>
<text class="num" x="336" y="576.5">8</text>
<rect x="448" y="562" width="124" height="20" rx="10" fill="#8a6cd6"/>
<text class="cc" x="510" y="576.3">Program Change</text>
<text class="l" x="328" y="606">Instrument button</text>
<text class="d" x="328" y="626">Pick an instrument (127 = next)</text>
<rect x="598" y="548" width="270" height="112" rx="14" fill="#ffffff" stroke="#efe6dd"/>
<circle cx="620" cy="572" r="10" fill="#2f9b80"/>
<text class="num" x="620" y="576.5">9</text>
<rect x="808" y="562" width="48" height="20" rx="10" fill="#2f9b80"/>
<text class="cc" x="832" y="576.3">CC64</text>
<text class="l" x="612" y="606">Sustain pedal</text>
<text class="d" x="612" y="626">Sound rings while pressed (no</text>
<text class="d" x="612" y="642">sustain on Organ)</text>
<text class="n" x="30" y="676">Can't find your knob? It may send another CC: full list in docs/ENGINES.md (Russian)</text>
