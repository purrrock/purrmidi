<text class="l" x="468" y="354">Volume</text>
<text class="d" x="468" y="374">Master volume,</text>
<text class="d" x="468" y="390">everywhere</text>
<rect x="666" y="296" width="198" height="124" rx="14" fill="#ffffff" stroke="#efe6dd"/>
