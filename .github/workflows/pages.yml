name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # веб-демо собирается из исходников движков
      - 'Platform/web/**'
      - 'Engine/synth/**'
      - 'Engine/midi/chord_detector.*'
      - 'Middlewares/Third_Party/**'
      - 'tests/web/wasm_smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Веб-демо: движки из репозитория -> WebAssembly (Zig содержит clang, libc++ и wasi-libc)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web demo (WebAssembly)
        run: |
          pip install ziglang==0.17.0
          bash Platform/web/build.sh
      - name: Smoke-test web demo
        run: node tests/web/wasm_smoke.mjs
      # Веб-прошивальщик (site/flash): протокол DfuSe проверяется на эмуляторе загрузчика.
      - name: Test web flasher (DFU protocol, ELF parser)
        run: node tests/web/dfuse_test.mjs

      # Веб-прошивальщик предлагает последний релиз. Файл кладётся рядом со страницей (тот же origin),
      # потому что браузер не даст скачать вложение релиза с github.com из-за CORS.
      # Релиза ещё нет - не ошибка: страница тогда принимает только файл пользователя.
      - name: Fetch latest release firmware for the web flasher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "::notice::Релизов пока нет: веб-прошивальщик примет только файл пользователя."
            exit 0
          fi
          dir=site/flash/firmware
          mkdir -p "$dir"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern purrmidi.elf --pattern SHA256SUMS --dir "$dir"
          (cd "$dir" && grep ' purrmidi.elf$' SHA256SUMS | sha256sum -c -)
          rm "$dir/SHA256SUMS"
          printf '{"tag":"%s","file":"purrmidi.elf"}\n' "$tag" > "$dir/manifest.json"
          cat "$dir/manifest.json"
          ls -l "$dir"

      - name: Copy SoundFont banks for the demo
        run: |
          mkdir -p site/demo/banks
          for f in 000_Florestan_Piano 040_Florestan_String_Quartet 068_Florestan_Woodwinds 052_Florestan_Ahh_Choir 014_Florestan_Tubular_Bells_and_glide; do
            cp "SoundFonts/Florestan/$f.sf2" site/demo/banks/
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
