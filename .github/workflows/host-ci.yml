```yaml
name: Host Build & Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  host-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev

      - name: Configure CMake host tests
        run: cmake --preset host-tests

      - name: Build host tests
        run: cmake --build --preset host-tests

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

  host-build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: llvm/actions/install-ninja@main

      - name: Configure MSVC Release build
        run: cmake --preset win-msvc-release

      - name: Build purrmidi_win.exe
        run: cmake --build --preset win-msvc-release

  stm32-build:
    name: Build STM32H743 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Verify ARM toolchain
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version

      - name: Configure STM32 firmware
        run: cmake --preset Debug

      - name: Build STM32 firmware
        run: cmake --build --preset Debug

      - name: Verify firmware ELF
        run: test -s build/Debug/purrmidi.elf

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: purrmidi-stm32h743-firmware
          path: build/Debug/purrmidi.elf
          if-no-files-found: error
          retention-days: 14
```