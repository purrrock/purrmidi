name: Host Build & Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  host-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev

      - name: Configure CMake host tests
        run: cmake --preset host-tests

      - name: Build host tests
        run: cmake --build --preset host-tests

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure --no-tests=error

      # Ветка SF2_DIAG_STATS=0 - это Release прошивки (статистика выключена). Раньше она не собиралась нигде и
      # могла сломаться незаметно: хост-сборка идёт с -Wextra -Werror, как раз и ловит такие ошибки.
      - name: Host tests with SF2_DIAG_STATS=0 (как в Release прошивки)
        run: |
          cmake --preset host-tests -B build/host-tests-nodiag -DCMAKE_CXX_FLAGS="-DSF2_DIAG_STATS=0"
          cmake --build build/host-tests-nodiag
          ctest --test-dir build/host-tests-nodiag --output-on-failure --no-tests=error

  web-sf2-parity:
    name: Web SF2 shrink tool (parity with sf2_shrink.py)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install numpy
        run: python3 -m pip install numpy

      # JS-порт в site/sf2/sf2shrink.js обязан давать тот же результат, что и SoundFonts/sf2_shrink.py.
      - name: Compare JS port with sf2_shrink.py
        run: node tests/web/sf2_parity.mjs

  web-flasher:
    name: Web flasher (DfuSe protocol, ELF parser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # site/flash/*.js против эмулятора USB-загрузчика STM32 (tests/web/fake_bootloader.mjs).
      - name: Test DFU protocol and ELF parsing
        run: node tests/web/dfuse_test.mjs

  host-tests-sanitizers:
    name: Host tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev

      - name: Configure (AddressSanitizer + UndefinedBehaviorSanitizer)
        run: cmake --preset host-tests-asan

      - name: Build
        run: cmake --build --preset host-tests-asan

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset host-tests-asan --no-tests=error

  host-build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        # Закреплено на конкретном коммите (а не на плавающей ветке main): сборка воспроизводима, и изменение
        # стороннего action не попадёт в CI незаметно. Обновлять осознанно.
        uses: llvm/actions/install-ninja@89a8cf80982d830faab019237860b344a6390c30

      - name: Configure MSVC Release build
        run: cmake --preset win-msvc-release

      - name: Build purrmidi_win.exe
        run: cmake --build --preset win-msvc-release

      - name: Run host tests (Windows)
        # --no-tests=error: пустой набор тестов не должен выглядеть как успех.
        run: ctest --preset win-msvc-release --no-tests=error

  stm32-build:
    name: Build STM32H743 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Verify ARM toolchain
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version

      # Предупреждения в коде проекта = ошибки (сторонние каталоги подключены как SYSTEM).
      - name: Configure STM32 firmware (Debug)
        run: cmake --preset Debug -DPURRMIDI_WERROR=ON

      - name: Build STM32 firmware (Debug)
        run: cmake --build --preset Debug

      - name: Verify firmware ELF
        run: test -s build/Debug/purrmidi.elf

      # Release - это то, что реально работает на приборе (-O2 для аудио-кода): собираем и его, чтобы
      # ошибки, видимые только при оптимизации, не доезжали до релиза.
      - name: Configure STM32 firmware (Release)
        run: cmake --preset Release -DPURRMIDI_WERROR=ON

      - name: Build STM32 firmware (Release)
        run: cmake --build --preset Release

      - name: Check Release firmware size budget
        run: bash tools/check_firmware_size.sh build/Release/purrmidi.elf

      # -O2 у горячих аудио-файлов и -Wextra у кода проекта: потеря этих флагов не даёт ни предупреждений, ни падения тестов.
      - name: Check compiler flags of firmware sources
        run: |
          bash tools/check_firmware_flags.sh build/Release/compile_commands.json
          bash tools/check_firmware_flags.sh build/Debug/compile_commands.json

      # Образы для прошивки платы собираются из Release (на приборе работает именно он).
      - name: Create Release .bin and .hex
        run: |
          arm-none-eabi-objcopy -O binary build/Release/purrmidi.elf build/Release/purrmidi.bin
          arm-none-eabi-objcopy -O ihex build/Release/purrmidi.elf build/Release/purrmidi.hex
          ls -l build/Release/purrmidi.elf build/Release/purrmidi.bin build/Release/purrmidi.hex

      # Образ, который соберёт веб-прошивальщик из настоящего ELF, должен совпасть с objcopy (кроме зазоров: там 0xFF)
      # и без ошибок пройти через эмулятор загрузчика.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web flasher accepts the real firmware ELF
        run: node tests/web/dfuse_test.mjs build/Release/purrmidi.elf build/Release/purrmidi.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: purrmidi-stm32h743-firmware
          path: |
            build/Release/purrmidi.elf
            build/Release/purrmidi.bin
            build/Release/purrmidi.hex
            build/Debug/purrmidi.elf
          if-no-files-found: error
          retention-days: 14